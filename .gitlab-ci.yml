stages:
  - verify
  - build
  - internal_publish
  - approve
  - publish

verify_release_projection:
  stage: verify
  script:
    - node --version
    - npm run verify

generate_wiki_projection:
  stage: build
  script:
    - python3 tools/handbook_to_wiki.py --root . --out .build/wiki
    - test -f .build/wiki/gitlab/home.md
    - test -f .build/wiki/gitlab/_sidebar.md
    - test -f .build/wiki/github/Home.md
    - test -f .build/wiki/github/_Sidebar.md
    - test -f .build/wiki/codeberg/Home.md
    - test -f .build/wiki/codeberg/_Sidebar.md
  artifacts:
    paths:
      - .build/wiki/
    expire_in: 7 days

publish_gitlab_wiki:
  stage: internal_publish
  needs:
    - job: generate_wiki_projection
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "release" && $CI_COMMIT_REF_PROTECTED == "true"'
  script:
    - bash scripts/publish_gitlab_wiki.sh

approve_public_projection:
  stage: approve
  rules:
    - if: '$CI_COMMIT_BRANCH == "release" && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
  script:
    - echo "Manual approval gate before publishing public repository and wiki projections."

publish_public_repositories:
  stage: publish
  needs:
    - job: approve_public_projection
  rules:
    - if: '$CI_COMMIT_BRANCH == "release" && $CI_COMMIT_REF_PROTECTED == "true"'
  before_script:
    - git config --global user.name "codex-hooks GitLab CI"
    - git config --global user.email "ci@codex-hooks.local"
  script:
    - bash scripts/publish_public_repos.sh

publish_wiki_projection:
  stage: publish
  needs:
    - job: generate_wiki_projection
      artifacts: true
    - job: approve_public_projection
  rules:
    - if: '$CI_COMMIT_BRANCH == "release" && $CI_COMMIT_REF_PROTECTED == "true"'
  before_script:
    - git config --global user.name "codex-hooks GitLab CI"
    - git config --global user.email "ci@codex-hooks.local"
  script:
    - bash scripts/publish_wikis.sh
